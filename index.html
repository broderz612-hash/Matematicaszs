<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Datos — Matemáticas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Fraunces:wght@600;700&display=swap');
:root{--bg:#f3eee4;--surface:#fffdf8;--ink:#1c2822;--muted:#3f5349;--primary:#0f5c3d;--soft:#e3f2ea;--accent:#e09a2b;--line:#e4dccb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.app{max-width:680px;min-height:100vh;margin:auto;border-left:8px solid var(--accent);padding:32px 24px}.head{display:flex;gap:14px;align-items:flex-start}.logo{display:grid;place-items:center;width:52px;height:52px;flex-shrink:0;background:var(--primary);color:white;border-radius:16px;font-size:27px}.eyebrow{margin:0 0 4px;color:var(--primary);font-size:13px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.12}h1{font-size:clamp(30px,7vw,42px)}h2{font-size:27px}p{line-height:1.6}.intro{font-size:18px;margin:24px 0}.primary,.secondary,.choice,.topic{border-radius:15px;padding:15px 17px;font-weight:900}.primary{background:var(--primary);color:white;width:100%;font-size:18px;min-height:56px}.secondary{background:var(--soft);color:var(--primary)}.muted{color:var(--muted);font-size:14px;text-align:center}.section{margin-top:30px}.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.topic{background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:5px;color:var(--ink)}.topic span{font-size:13px;color:var(--muted);font-weight:700}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin:18px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:900}.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 24px}.progress div{height:100%;background:var(--primary);transition:width .2s}.prompt{font-size:23px;line-height:1.35;margin:15px 0}.help{color:var(--muted);margin-top:-5px}.visual{background:#f8f5ed;border-radius:15px;padding:15px;margin:16px 0}.visual-title{font-weight:900;color:var(--primary);margin:0 0 12px}.people{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.person{background:var(--soft);border-radius:12px;padding:12px 14px;text-align:center;min-width:72px}.person small{display:block;color:var(--muted)}.person strong{font-family:Fraunces,Georgia,serif;font-size:29px}.bars{display:flex;align-items:end;justify-content:space-around;gap:12px;height:150px;border-bottom:2px solid var(--line);padding:10px 4px 0}.barwrap{display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;flex:1;gap:5px}.bar{width:min(44px,80%);background:var(--primary);border-radius:7px 7px 0 0;min-height:4px}.barwrap b{font-size:13px}.barwrap small{font-size:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}.choices{display:grid;gap:10px}.choice{background:var(--surface);border:2px solid var(--line);text-align:left;color:var(--ink);display:flex;gap:12px;align-items:center}.letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--soft);color:var(--primary);flex-shrink:0}.choice.correct{border-color:var(--primary);background:var(--soft)}.choice.wrong{border-color:#b34c35;background:#fff0eb}.feedback{padding:14px;border-radius:13px;background:var(--soft);margin-top:15px;line-height:1.5}.feedback.bad{background:#fff0eb}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}.result{text-align:center;padding:26px 8px}.score{font-family:Fraunces,Georgia,serif;font-size:58px;color:var(--primary);margin:14px}.review{text-align:left}.review li{margin:12px 0;line-height:1.45}.hidden{display:none!important}.hint-toggle{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;border:2px solid var(--accent);border-radius:13px;background:#fff7df;color:var(--ink);font-weight:900}.hint-box{padding:13px 15px;margin:0 0 16px;border-radius:13px;background:#fff7df;border:1px solid #e9c779;color:var(--ink);line-height:1.5}.hint-box b{color:#80520d;display:block;margin-bottom:4px}@media(max-width:480px){.app{padding:24px 15px;border-left-width:6px}.topics{grid-template-columns:1fr}.card{padding:15px}.prompt{font-size:21px}}

.pie-layout{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.pie{width:145px;height:145px;border-radius:50%;flex-shrink:0}.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}.poly{width:100%;max-height:180px;overflow:visible}.legend span{margin-right:5px}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>const topics=[
{id:'rango',label:'Rango',definition:'Resta el dato menor al dato mayor.'},
{id:'media',label:'Media',definition:'Suma los datos y divide entre cuántos hay.'},
{id:'moda',label:'Moda',definition:'Es el dato que más veces se repite.'},
{id:'mediana',label:'Mediana',definition:'Es el dato central después de ordenar.'},
{id:'frecuencia',label:'Tabla de frecuencia',definition:'Cuenta cuántas veces aparece cada dato.'},
{id:'barras',label:'Gráfica de barras',definition:'Compara cantidades entre categorías.'},
{id:'pastel',label:'Gráfica de pastel',definition:'Muestra cómo se reparte un total.'},
{id:'poligono',label:'Polígono de frecuencias',definition:'Une puntos que representan frecuencias.'}
];
const app=document.getElementById('app');let mode='mix',questions=[],index=0,answers=[],picked=null,best=readBest();
function readBest(){try{return JSON.parse(localStorage.getItem('cuadernoDatosBest'))}catch(e){return null}}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function numberOptions(correct, candidates){let vals=[...new Set([correct,...candidates].map(String))];while(vals.length<4){let n=Number(correct)+rand(-4,4);if(n>=0&&!vals.includes(String(n)))vals.push(String(n))}return shuffled(vals.slice(0,4))}
function makeQ(topic,prompt,visual,correct,explanation,options){return {topic,prompt,visual,choices:options||numberOptions(correct,[Number(correct)+1,Number(correct)-1,Number(correct)+2,Number(correct)-2].filter(n=>n>=0)),answer:String(correct),explanation}}
function createQuestion(t){
 let vals,correct,visual,labels,counts;
 if(t==='rango'){
  vals=Array.from({length:5},()=>rand(2,18));let hi=Math.max(...vals),lo=Math.min(...vals);correct=hi-lo;
  return makeQ(t,`En una encuesta se obtuvieron estos datos: ${vals.join(', ')}. ¿Cuál es el rango?`,{type:'people',values:vals},correct,`El rango se obtiene restando el menor dato al mayor: ${hi} − ${lo} = ${correct}.`,numberOptions(correct,[hi+lo,hi,lo,Math.max(0,correct-1)]));
 }
 if(t==='media'){
  let n=rand(3,5),base=rand(2,8);vals=Array.from({length:n},()=>base+rand(-2,2));let sum=vals.reduce((a,b)=>a+b,0);if(sum%n!==0)return createQuestion(t);correct=sum/n;
  return makeQ(t,`Estas son las páginas que leyó una persona durante ${n} días: ${vals.join(', ')}. ¿Cuál fue la media diaria?`,{type:'people',values:vals},correct,`Sumamos los datos: ${vals.join(' + ')} = ${sum}. Después dividimos entre ${n}: ${sum} ÷ ${n} = ${correct}.`,numberOptions(correct,[correct+1,correct-1,Math.max(0,sum-correct),sum]));
 }
 if(t==='moda'){
  let repeated=rand(2,9),other=[rand(1,10),rand(1,10),rand(1,10)].filter(n=>n!==repeated);while(other.length<3){let n=rand(1,10);if(n!==repeated)other.push(n)}vals=shuffled([repeated,repeated,repeated,...other.slice(0,2)]);correct=repeated;
  return makeQ(t,`¿Cuál es la moda de estos datos? ${vals.join(', ')}.`,{type:'people',values:vals},correct,`El ${correct} es la moda porque aparece tres veces y los demás datos aparecen menos veces.`,numberOptions(correct,[...new Set(vals.filter(n=>n!==correct)),correct+1,Math.max(0,correct-1)]));
 }
 if(t==='mediana'){
  vals=Array.from({length:5},()=>rand(1,20)).sort((a,b)=>a-b);correct=vals[2];
  return makeQ(t,`Una estudiante registró estos tiempos (en minutos): ${vals.join(', ')}. ¿Cuál es la mediana?`,{type:'people',values:vals},correct,`Los datos ya están ordenados. Como hay cinco datos, la mediana es el tercero: ${correct}.`,numberOptions(correct,[vals[0],vals[1],vals[3],vals[4]]));
 }
 if(t==='frecuencia'){
  let sample=Array.from({length:10},()=>rand(1,4));counts=[1,2,3,4].map(n=>sample.filter(x=>x===n).length);let max=Math.max(...counts);if(counts.filter(c=>c===max).length>1)return createQuestion(t);correct=String(counts.indexOf(max)+1);
  return makeQ(t,`La tabla resume las calificaciones de una actividad. ¿Qué calificación apareció con mayor frecuencia?`,{type:'table',labels:['1','2','3','4'],values:counts},correct,`La frecuencia más alta es ${max}; corresponde a la calificación ${correct}.`,['1','2','3','4'].filter(n=>n!==correct).concat(correct).sort(()=>Math.random()-.5));
 }
 labels=t==='barras'?['Manzana','Pera','Uva','Mango']:t==='pastel'?['Fútbol','Básquetbol','Natación','Voleibol']:['Lun','Mar','Mié','Jue','Vie'];
 vals=labels.map(()=>rand(2,12));let max=Math.max(...vals);if(vals.filter(v=>v===max).length>1)return createQuestion(t);let winner=labels[vals.indexOf(max)];
 if(t==='barras')return makeQ(t,'La gráfica muestra la fruta favorita de un grupo. ¿Qué fruta recibió más votos?',{type:'barras',labels,values:vals},winner,max===1?'':`La barra más alta es la de ${winner}, con ${max} votos.`,shuffled([winner,...labels.filter(l=>l!==winner)]));
 if(t==='pastel')return makeQ(t,'El gráfico circular muestra el deporte favorito de un grupo. ¿Qué deporte representa la porción más grande?',{type:'pastel',labels,values:vals},winner,`${winner} tiene la mayor cantidad (${max}), así que representa la porción más grande del total.`,shuffled([winner,...labels.filter(l=>l!==winner)]));
 return makeQ(t,'El polígono muestra cuántos libros leyeron durante cada día. ¿En qué día se registró la frecuencia más alta?',{type:'poligono',labels,values:vals},winner,`El punto más alto corresponde a ${winner}, con una frecuencia de ${max}.`,shuffled([winner,...labels.filter(l=>l!==winner)]));
}
function build(nextMode){mode=nextMode;let pool=nextMode==='mix'?topics:topics.filter(t=>t.id===nextMode);questions=pool.map(t=>createQuestion(t.id));if(nextMode==='mix')questions=shuffled(questions);index=0;answers=[];picked=null;renderPlay()}
function visualHTML(v){
 if(v.type==='people')return `<div class="visual"><p class="visual-title">Datos registrados</p><div class="people">${v.values.map((n,i)=>`<div class="person"><small>Dato ${i+1}</small><strong>${n}</strong></div>`).join('')}</div></div>`;
 if(v.type==='table')return `<div class="visual"><p class="visual-title">Tabla de frecuencia</p><table class="table"><tr><th>Calificación</th><th>Frecuencia</th></tr>${v.labels.map((l,i)=>`<tr><td>${l}</td><td>${v.values[i]}</td></tr>`).join('')}</table></div>`;
 if(v.type==='pastel'){let total=v.values.reduce((a,b)=>a+b,0),start=0,parts=v.values.map((n,i)=>{let from=start;start+=n/total*100;return `${['#0f5c3d','#e09a2b','#679b82','#c66c4d'][i]} ${from}% ${start}%`});return `<div class="visual"><p class="visual-title">Gráfica circular</p><div class="pie-layout"><div class="pie" style="background:conic-gradient(${parts.join(',')})" role="img" aria-label="Gráfica circular de deportes favoritos"></div><div class="legend">${v.labels.map((l,i)=>`<div><i style="background:${['#0f5c3d','#e09a2b','#679b82','#c66c4d'][i]}"></i>${l}: ${v.values[i]}</div>`).join('')}</div></div></div>`}
 if(v.type==='poligono'){let max=Math.max(...v.values),pts=v.values.map((n,i)=>`${25+i*62},${125-(n/max)*95}`).join(' ');return `<div class="visual"><p class="visual-title">Polígono de frecuencias</p><svg viewBox="0 0 300 155" class="poly" role="img" aria-label="Polígono de frecuencias"><line x1="20" y1="130" x2="285" y2="130" stroke="#cfc6b5"/><line x1="20" y1="20" x2="20" y2="130" stroke="#cfc6b5"/><polyline points="${pts}" fill="none" stroke="#0f5c3d" stroke-width="3" stroke-linejoin="round"/>${v.values.map((n,i)=>`<circle cx="${25+i*62}" cy="${125-(n/max)*95}" r="4" fill="#e09a2b"/><text x="${25+i*62}" y="145" font-size="10" text-anchor="middle" fill="#3f5349">${v.labels[i]}</text>`).join('')}</svg><div class="legend">${v.values.map((n,i)=>`<span>${v.labels[i]}: ${n}</span>`).join(' · ')}</div></div>`}
 return `<div class="visual"><p class="visual-title">Gráfica de barras · votos por fruta</p><div class="bars">${v.labels.map((l,i)=>`<div class="barwrap"><b>${v.values[i]}</b><div class="bar" style="height:${Math.max(5,v.values[i]/Math.max(...v.values)*100)}%"></div><small>${l}</small></div>`).join('')}</div></div>`;
}
function renderHome(){app.innerHTML=`<header class="head"><div class="logo">▤</div><div><p class="eyebrow">Matemáticas · Estadística</p><h1>Cuaderno de Datos</h1></div></header><p class="intro">Practica con preguntas de estadística que tienen datos, opciones y explicaciones coherentes. Cada intento genera nuevos ejercicios.</p><button class="primary" onclick="build('mix')">Empezar cuestionario →</button><p class="muted">8 preguntas · una por cada tema</p>${best?`<p class="muted"><b>Mejor marca: ${best.score} de ${best.total}</b></p>`:''}<section class="section"><h2>Practicar un tema</h2><div class="topics">${topics.map(t=>`<button class="topic" onclick="build('${t.id}')">${t.label}<span>${t.definition}</span></button>`).join('')}</div></section><p class="muted">Lee la pregunta y los datos antes de elegir una respuesta.</p>`}
function renderPlay(){let q=questions[index];picked=null;app.innerHTML=`<div class="topline"><button class="secondary" onclick="renderHome()">← Salir</button><span>${index+1} de ${questions.length}</span></div><div class="progress"><div style="width:${index/questions.length*100}%"></div></div><p class="eyebrow">${topics.find(t=>t.id===q.topic)?.label||q.topic}</p><h2 class="prompt">${q.prompt}</h2><button class="hint-toggle" type="button" onclick="toggleHint()" aria-expanded="false" aria-controls="hintBox">💡 Ver pista</button><div id="hintBox" class="hint-box hidden" role="note"><b>Una pista para resolverlo</b>${getHint(q)}</div>${visualHTML(q.visual)}<div class="choices">${q.choices.map((c,i)=>`<button class="choice" type="button" data-choice="${String(c).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" onclick="choose(this.dataset.choice,this)"><span class="letter">${'ABCD'[i]}</span>${c}</button>`).join('')}</div><div id="feedback"></div>`}
function getHint(q){switch(q.topic){case 'rango':return 'Busca el dato más grande y el más pequeño. Luego réstale el menor al mayor.';case 'media':return 'Suma todos los valores y divide el resultado entre la cantidad de datos.';case 'moda':return 'Cuenta cuántas veces aparece cada número. La moda es el que se repite más.';case 'mediana':return 'Ordena los números de menor a mayor y encuentra el que queda en medio.';case 'frecuencia':return 'Compara las frecuencias de la tabla. Busca la frecuencia más alta y mira a qué calificación pertenece.';case 'barras':return 'Compara la altura de las barras: la más alta representa la mayor cantidad de votos.';case 'pastel':return 'Observa cuál porción del círculo es más grande; corresponde a la categoría con mayor cantidad.';case 'poligono':return 'Busca el punto más alto de la línea y lee la etiqueta del día que está debajo.';default:return 'Lee con cuidado los datos y piensa qué procedimiento corresponde al tema.'}}
function toggleHint(){const box=document.getElementById('hintBox'),button=document.querySelector('.hint-toggle');if(!box||!button)return;const willShow=box.classList.contains('hidden');box.classList.toggle('hidden');button.setAttribute('aria-expanded',String(willShow));button.innerHTML=willShow?'💡 Ocultar pista':'💡 Ver pista'}
function choose(choice,el){if(picked!==null)return;picked=choice;let q=questions[index],ok=String(choice)===q.answer;answers.push({q,choice,ok});document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;let label=b.textContent.trim().slice(1).trim();if(label===q.answer)b.classList.add('correct');if(label===String(choice)&&!ok)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'¡Correcto!':'No exactamente.'}</b><br>${q.explanation}</div><div class="actions"><button class="primary" onclick="nextQuestion()">${index===questions.length-1?'Ver resultado':'Siguiente →'}</button></div>`}
function nextQuestion(){if(index<questions.length-1){index++;renderPlay()}else renderDone()}
function renderDone(){let score=answers.filter(a=>a.ok).length;let record=false;if(mode==='mix'&&(!best||score>best.score)){best={score,total:answers.length};record=true;try{localStorage.setItem('cuadernoDatosBest',JSON.stringify(best))}catch(e){}}app.innerHTML=`<div class="result"><p class="eyebrow">Cuestionario terminado</p><h1>${record?'¡Nueva mejor marca!':'¡Buen trabajo!'}</h1><div class="score">${score}/${answers.length}</div><p>${score===answers.length?'¡Perfecto! Respondiste todo correctamente.':score>=answers.length/2?'Vas por buen camino. Revisa las explicaciones para mejorar.':'No te preocupes: repasa las explicaciones y vuelve a intentarlo.'}</p></div><div class="actions"><button class="primary" onclick="build('${mode}')">Intentar de nuevo</button><button class="secondary" onclick="renderHome()">Inicio</button></div><section class="card review"><h2>Repaso de respuestas</h2><ol>${answers.map(a=>`<li><b>${a.q.prompt}</b><br>Tu respuesta: ${a.choice} · ${a.ok?'Correcta':'Respuesta correcta: '+a.q.answer}<br><span>${a.q.explanation}</span></li>`).join('')}</ol></section>`}
renderHome();
</script>
</body>
</html>
